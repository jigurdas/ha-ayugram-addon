name: "AyuGram Webtop"
version: "1.0.0"
slug: "ayugram_webtop"
description: "Run AyuGram (Telegram Desktop) in a Docker container and access it via the browser from anywhere."
url: "https://github.com/ayugram/AyuGramDesktop"
startup: system
arch:
  - amd64
  - arm64
  - armv7
  - i386
init: false
