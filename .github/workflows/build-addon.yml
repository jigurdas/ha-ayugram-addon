name: Build AyuGram Add-on

on:
  push:
    branches: [ main ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-addon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download AyuGram binary release asset
        run: |
          python3 scripts/download_ayugram_release.py --output-dir build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Read addon version
        id: version
        run: |
          VERSION=$(grep '^version:' ayugram/config.yaml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push addon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ayugram/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AYUGRAM_BINARY_PATH=build/AyuGram
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-ayugram-addon:latest
            ghcr.io/${{ github.repository_owner }}/ha-ayugram-addon:${{ steps.version.outputs.version }}
