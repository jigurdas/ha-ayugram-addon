name: "AyuGram WebTop"
description: "AyuGram Client for Home Assistant"
version: "1.0.2"
slug: "ayugram_webtop"
url: "https://github.com/jigurdas/ha-ayugram-addon"
startup: system
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 6901
panel_admin: true
panel_icon: "mdi:telegram"
panel_title: "AyuGram"
host_network: false
apparmor: false
ports:
  6901/tcp: 6901
ports_description:
  6901/tcp: "Web GUI (HTTP/HTTPS)"

options:
  disable_https: true
  custom_binary_path: "/opt/AyuGram/AyuGram"

schema:
  disable_https: bool
  custom_binary_path: str
